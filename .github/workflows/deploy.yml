name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: workout-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Checkout crystal-node
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/crystal-node
          token: ${{ secrets.CRYSTAL_NODE_TOKEN }}
          path: crystal-node

      - name: Update image tag in crystal-node
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          sed -i "s|image:.*fit-link.*|image: $IMAGE|" \
            crystal-node/k8s/fit-link/deployment.yaml

      - name: Commit and push
        working-directory: crystal-node
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/fit-link/deployment.yaml
          git commit -m "chore: update fit-link image to ${{ github.sha }}"
          git push
